version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marginalia-postgres
    environment:
      POSTGRES_DB: marginalia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marginalia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marginalia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: marginalia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: marginalia-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DATABASE_URL=Host=postgres;Port=5432;Database=marginalia;Username=postgres;Password=postgres;SSL Mode=Prefer
      - VECTOR_STORE_CONNECTION_STRING=Host=postgres;Port=5432;Database=marginalia;Username=postgres;Password=postgres
      - REDIS_CONNECTION_STRING=redis:6379
      - OLLAMA_ENDPOINT=http://ollama:11434
      - LLM_PROVIDER=Ollama
      - OLLAMA_CHAT_MODEL=llama3.2
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - CORS_ALLOWED_ORIGINS=chrome-extension://*,http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ~/.nuget/packages:/root/.nuget/packages

volumes:
  postgres_data:
  redis_data:
  ollama_data: